# Core iPad client for stock upstream Herder. Generated with XcodeGen.
---
name: Herdr
options:
  bundleIdPrefix: com.badarahmed
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  HerdrKit:
    path: "."
  SwiftTerm:
    path: Vendor/SwiftTerm
targets:
  Herdr:
    type: application
    platform: iOS
    sources:
    - path: App/CoreApp.swift
    - path: App/CoreRootView.swift
    - path: App/UpstreamTerminalView.swift
    - path: App/HostEditor.swift
    - path: App/SavedHosts.swift
    - path: App/DesignSystem.swift
    - path: App/Fonts
      buildPhase: resources
    - path: App/Assets.xcassets
      buildPhase: resources
    dependencies:
    - package: HerdrKit
      product: HerdrKit
    - package: SwiftTerm
      product: SwiftTerm
    scheme:
      testTargets:
      - HerdrUITests
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Herdr Core
        CFBundleName: Herdr Core
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
        - Geist-Regular.ttf
        - Geist-Medium.ttf
        - Geist-SemiBold.ttf
        - Geist-Bold.ttf
        - IBMPlexMono-Regular.ttf
        - IBMPlexMono-Medium.ttf
        - IBMPlexMono-SemiBold.ttf
        - IBMPlexMono-Bold.ttf
        - HerdrupSymbols-Regular.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connect to your Herder hosts over SSH on your
          local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badarahmed.herdr.core
        MARKETING_VERSION: 1.0.9
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: '2'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FA2N3ZW6ZV
  HerdrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: HerdrUITests/CoreUITests.swift
    dependencies:
    - target: Herdr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badarahmed.herdr.core.uitests
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: '2'
        CODE_SIGNING_ALLOWED: false
